[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "schulblick"
version = "0.1.0"
description = "Family overview for Schulportal Hessen (parent account): homework, exams, substitutions, messages."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.161.0",
  "uvicorn[standard]==0.54.0",
  "jinja2==3.1.6",
  "python-multipart==0.0.32",
  "httpx==0.28.1",
  "selectolax==1.0.2",
  "pycryptodome==4.1.0",
  "apscheduler==3.11.3",
  "argon2-cffi==25.1.0",
  "pyotp==2.10.0",
  "qrcode==8.2",
  "icalendar==7.3.0",
  "recurring-ical-events==3.8.2",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
schulblick = "schulblick.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
schulblick = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
