# /etc/nginx/sites-available/family.verstehst.de  (symlink into sites-enabled)
# Certificates are added by: certbot --nginx -d family.verstehst.de
# The rate-limit zone is defined in /etc/nginx/conf.d/schulblick-ratelimit.conf

server {
    listen 80;
    listen [::]:80;
    server_name family.verstehst.de;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name family.verstehst.de;

    # certbot fills these in; until then the setup script uses the HTTP-only bootstrap file
    ssl_certificate     /etc/letsencrypt/live/family.verstehst.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/family.verstehst.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 64k;
    server_tokens off;

    access_log /var/log/nginx/schulblick.access.log;
    error_log  /var/log/nginx/schulblick.error.log warn;

    location = /login {
        limit_req zone=schulblick_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8130;
        include /etc/nginx/snippets/schulblick-proxy.conf;
    }

    # calendar file upload (Outlook .ics export), the only larger request
    location = /kalender/import/datei {
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:8130;
        include /etc/nginx/snippets/schulblick-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8130;
        include /etc/nginx/snippets/schulblick-proxy.conf;
    }
}
